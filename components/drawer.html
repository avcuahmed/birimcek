<!-- Mobil Alt Toolbar -->
<div class="toolbar-bottom mobile-only">
  <a href="index.html" class="toolbar-item"><i class="fa-solid fa-house"></i><span>Ana Sayfa</span></a>
  <button class="toolbar-item" onclick="window.toggleCategoryMenu()"><i class="fa-solid fa-list"></i><span>Kategoriler</span></button>
  <button class="toolbar-item" onclick="window.toggleCart()"><i class="fa-solid fa-basket-shopping"></i><span>Sepetim</span></button>
  <a href="hesabim.html" class="toolbar-item"><i class="fa-solid fa-user"></i><span>Hesabım</span></a>
</div>

<!-- Sol Kategori Çekmecesi -->
<div id="categoryOverlay" class="drawer-overlay" onclick="window.toggleCategoryMenu()"></div>
<div id="categoryDrawer" class="side-drawer">
  <div class="drawer-header">
    <h3><i class="fa-solid fa-list"></i> Kategoriler</h3>
    <button class="drawer-close-btn" onclick="window.toggleCategoryMenu()"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <ul class="side-category-list">
    <li onclick="window.goToCategoryPage('Meyve & Sebze')"><i class="fa-solid fa-apple-whole"></i> Meyve & Sebze</li>
    <li onclick="window.goToCategoryPage('Süt & Kahvaltılık')"><i class="fa-solid fa-cow"></i> Süt & Kahvaltılık</li>
  </ul>
</div>

<!-- Sağ Sepet Çekmecesi -->
<div id="cartOverlay" class="drawer-overlay" onclick="window.toggleCart()"></div>
<div id="cartDrawer" class="side-drawer">
  <div class="drawer-header">
    <h3><i class="fa-solid fa-basket-shopping"></i> Sepetim</h3>
    <button class="drawer-close-btn" onclick="window.toggleCart()"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="cart-body" id="cartBody">
    <div class="cart-empty-state"><i class="fa-solid fa-basket-shopping"></i><p>Sepetiniz henüz boş.</p></div>
  </div>
  <div class="cart-footer">
    <div class="cart-total-row"><span>Tahmini Toplam:</span><strong id="cartTotalPrice">0.00 ₺</strong></div>
    <button class="cart-checkout-btn" onclick="alert('Listeniz hazırlandı!')">Market Karşılaştırması Yap</button>
  </div>
</div>
