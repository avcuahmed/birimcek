<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Aktüel & Fırsatlar | Birimçek</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"> 
</head>
<body>

  <div id="header-container"></div>

  <div class="main-container">
    <div class="hero-banner" style="background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);">
      <div class="hero-text">
        <h2>Haftanın En Büyük İndirimleri</h2>
        <p>Yapay zeka afiş tarayıcısının market broşürlerinden derlediği en sıcak fiyat düşüşleri.</p>
      </div>
    </div>

    <div class="section-title-wrap">
      <h3 class="section-title"><i class="fa-solid fa-bolt" style="color: #ef4444;"></i> Fırsat Panosu</h3>
    </div>

    <div class="discount-board-section">
      <div class="board-scroll" style="flex-direction: column; overflow-x: hidden;" id="firsatlarList">
        <div class="board-card" style="width: 100%;">
          <span class="board-badge">%25 İndirim</span>
          <div class="board-left-group">
            <img src="https://images.unsplash.com/photo-1542838132-92c53300491e?w=200&q=80" class="board-img" alt="Ürün">
            <div class="board-info">
              <h5>Ayçiçek Yağı 5L</h5>
              <div class="board-prices">
                <span class="old-price">245.00 ₺</span>
                <span class="new-price">185.00 ₺</span>
              </div>
              <span style="font-size:0.7rem; color:var(--primary); font-weight:700;">A101 • Birim: 37.00 ₺/L</span>
            </div>
          </div>
          <button class="add-to-cart-btn" style="width: auto; padding: 8px 16px;" onclick="window.addToCart('Ayçiçek Yağı 5L', 185.00, 'https://images.unsplash.com/photo-1542838132-92c53300491e?w=200&q=80')">Ekle</button>
        </div>
      </div>
    </div>
  </div>

  <div id="drawers-container"></div>
  <div id="footer-container"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
