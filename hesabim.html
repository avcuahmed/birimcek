<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Birimçek | Hesabım</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"> <!-- Tasarım kodlarınızı harici CSS'e taşıdıysanız -->
  <style>
    /* Eğer stiller bu sayfada kalacaksa buraya ekleyebilirsiniz */
    :root { --primary: #0b4d3c; --primary-light: #52e396; --text-dark: #191919; --text-muted: #666666; --border-color: #e5e5e5; --bg-soft: #f9fbf9; --font-main: 'Sora', sans-serif; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); }
    body { background-color: #ffffff; color: var(--text-dark); }
    /* ... (diğer tasarım stilleri) ... */
  </style>
</head>
<body>

  <!-- Dinamik Header Alanı -->
  <div id="header-container"></div>

  <!-- Sayfa İçeriği -->
  <main class="main-container">
    <h2 style="font-size: 1.5rem; font-weight: 800;">Kullanıcı Profilim & Ödüller</h2>
    <p style="color: var(--text-muted); font-size: 0.85rem;">Hesap bilgilerinizi buradan yönetebilirsiniz.</p>
  </main>

  <!-- Dinamik Çekmeceler ve Mobil Toolbar Alanı -->
  <div id="drawers-container"></div>

  <!-- Dinamik Footer Alanı -->
  <div id="footer-container"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
