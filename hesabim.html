<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Hesabim & Puanlar | Birimçek</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"> 
</head>
<body>

  <div id="header-container"></div>

  <div class="main-container">
    <div class="section-title-wrap">
      <h3 class="section-title"><i class="fa-regular fa-user" style="color: var(--primary);"></i> Kullanıcı Profilim & Ödüller</h3>
    </div>

    <div class="card-product" style="max-width: 600px; margin: 0 auto; padding: 25px;">
      <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
        <div style="width: 60px; height: 60px; background: var(--bg-soft); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: var(--primary);">
          <i class="fa-solid fa-user-astronaut"></i>
        </div>
        <div>
          <h4 style="font-size: 1.1rem; font-weight: 800;">Birimçek Kullanıcısı</h4>
          <p style="font-size: 0.85rem; color: var(--text-muted);">Aktif Üye</p>
        </div>
      </div>

      <div class="unit-price-box" style="display: flex; justify-content: space-between; align-items: center; padding: 15px; margin-bottom: 20px;">
        <div>
          <span style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted); display: block;">Toplam Puanın</span>
          <span class="unit-price-val" style="font-size: 1.4rem;"><i class="fa-solid fa-star" style="color: var(--reward-color);"></i> 12 Puan</span>
        </div>
        <button class="video-upload-btn" onclick="window.toggleVideoModal()">Puan Kazan</button>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <button class="add-to-cart-btn" style="background: var(--bg-soft); color: var(--text-dark); border: 1px solid var(--border-color);" onclick="window.toggleReceiptModal()">
          <i class="fa-solid fa-receipt" style="color: var(--primary);"></i> Fişlerim ve Yüklemelerim
        </button>
      </div>
    </div>
  </div>

  <div id="drawers-container"></div>
  <div id="footer-container"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
