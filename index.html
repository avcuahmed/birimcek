<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birimçek - Akıllı Birim Fiyat Karşılaştırma</title>
  <style>
    :root {
      --primary: #1e3c72;
      --primary-light: #2a5298;
      --accent: #10b981;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); padding-bottom: 60px; }
    
    header {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      padding: 35px 20px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(30, 60, 114, 0.15);
    }
    header h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; }
    header p { font-size: 1rem; opacity: 0.9; font-weight: 300; }

    .container { max-width: 1100px; margin: -20px auto 0; padding: 0 20px; position: relative; z-index: 10; }
    
    /* Arama ve Filtre Paneli */
    .controls-panel {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .search-bar {
      width: 100%;
      padding: 12px 18px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-bar:focus { border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.1); }

    .categories-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .categories-bar::-webkit-scrollbar { display: none; }

    .cat-chip {
      background: #f1f5f9;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .cat-chip:hover, .cat-chip.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Ürün Kartları Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.08);
    }

    .badge-best {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--accent);
      color: white;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
      z-index: 2;
    }

    .product-img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #f1f5f9;
    }

    .product-body { padding: 18px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
    .product-meta { font-size: 0.78rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
    .product-title { font-size: 1.05rem; font-weight: 700; color: var(--text-main); margin-bottom: 12px; line-height: 1.3; }

    .price-container {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .unit-price-val { font-size: 1.15rem; font-weight: 800; color: #e11d48; }
    .unit-price-lbl { font-size: 0.7rem; color: var(--text-muted); display: block; font-weight: 500; }
    .net-price-val { text-align: right; font-size: 0.9rem; font-weight: 700; color: var(--text-main); }
    .net-price-lbl { font-size: 0.7rem; color: var(--text-muted); display: block; font-weight: 500; }

    /* Pop-up */
    .popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 9999; }
    .popup-card { background: white; padding: 28px; border-radius: 20px; max-width: 420px; width: 90%; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
    .popup-card h3 { color: var(--primary); margin-bottom: 10px; font-size: 1.25rem; }
    .popup-card p { font-size: 0.9rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 20px; }
    .btn-close { background: var(--primary); color: white; border: none; padding: 10px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; }
  </style>
</head>
<body>

  <header>
    <h1>Birimçek</h1>
    <p>Rafları Çek, En Ucuz Birim Fiyatı Anında Bul</p>
  </header>

  <div id="unitPricePopup" class="popup-overlay">
    <div class="popup-card">
      <h3>📊 Akıllı Birim Fiyat Sıralaması</h3>
      <p>Sistemimiz paket fiyatına bakmaksızın ürünleri <strong>1 Kg / 1 Litre birim maliyetine</strong> göre otomatik sıralar.</p>
      <button class="btn-close" onclick="document.getElementById('unitPricePopup').style.display='none'">Anladım</button>
    </div>
  </div>

  <div class="container">
    <div class="controls-panel">
      <input type="text" id="searchInput" class="search-bar" placeholder="Ürün adı veya marka ara..." oninput="filterProducts()">
      
      <div class="categories-bar" id="categoryList">
        <button class="cat-chip active" onclick="selectCategory('Tümü', this)">Tümü</button>
      </div>
    </div>

    <div id="productList" class="product-grid">
      <p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">Veriler yükleniyor...</p>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = "https://uuvldmikiiqtutisrhjg.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1dmxkbWlraWlxdHV0aXNyaGpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczOTU0NjIsImV4cCI6MjEwMjk3MTQ2Mn0.RWeP1HAjIw1m0zv4ZAPEaoovyMS2-ckhCmqtl0xLDEU";
    
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let allProductsCombined = [];
    let activeCategory = 'Tümü';

    async function loadData() {
      const container = document.getElementById("productList");

      try {
        const { data: prices } = await supabase.from('prices').select('*');
        const { data: products } = await supabase.from('products').select('*');
        const { data: markets } = await supabase.from('markets').select('*');

        if (!prices || prices.length === 0) {
          container.innerHTML = `<p style="text-align:center; grid-column:1/-1; color:var(--text-muted);">Henüz veritabanında ürün bulunmuyor.</p>`;
          return;
        }

        allProductsCombined = prices.map(price => {
          const prod = products ? products.find(p => p.id === price.product_id) : {};
          const market = markets ? markets.find(m => m.id === price.market_id) : {};
          const unitPrice = price.net_price / (prod.net_quantity || 1);

          return {
            ...price,
            product: prod || {},
            market: market || {},
            unitPrice: unitPrice
          };
        }).sort((a, b) => a.unitPrice - b.unitPrice);

        setupCategories();
        renderProducts(allProductsCombined);

      } catch (err) {
        container.innerHTML = `<p style="color:red; text-align:center; grid-column:1/-1;">Hata: ${err.message}</p>`;
      }
    }

    function setupCategories() {
      const catContainer = document.getElementById("categoryList");
      const categories = ['Tümü', ...new Set(allProductsCombined.map(item => item.product.category).filter(Boolean))];
      
      catContainer.innerHTML = categories.map((cat, idx) => `
        <button class="cat-chip ${idx === 0 ? 'active' : ''}" onclick="window.selectCategory('${cat}', this)">${cat}</button>
      `).join('');
    }

    window.selectCategory = function(cat, element) {
      document.querySelectorAll('.cat-chip').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      activeCategory = cat;
      filterProducts();
    };

    window.filterProducts = function() {
      const searchTerm = document.getElementById("searchInput").value.toLowerCase();
      
      const filtered = allProductsCombined.filter(item => {
        const matchesCategory = activeCategory === 'Tümü' || item.product.category === activeCategory;
        const matchesSearch = (item.product.title || '').toLowerCase().includes(searchTerm) || 
                              (item.product.brand || '').toLowerCase().includes(searchTerm);
        return matchesCategory && matchesSearch;
      });

      renderProducts(filtered);
    };

    function renderProducts(items) {
      const container = document.getElementById("productList");
      
      if (items.length === 0) {
        container.innerHTML = `<p style="text-align:center; grid-column:1/-1; color:var(--text-muted); padding:20px;">Aradığınız kriterlere uygun ürün bulunamadı.</p>`;
        return;
      }

      const defaultImg = "https://images.unsplash.com/photo-1542838132-92c53300491e?w=500&q=80";

      container.innerHTML = items.map((item, index) => {
        const prod = item.product;
        const market = item.market;
        const isBestValue = index === 0 && activeCategory === 'Tümü';

        return `
          <div class="product-card">
            ${isBestValue ? `<div class="badge-best">🏆 En Avantajlı</div>` : ''}
            <img src="${prod.image_url || defaultImg}" class="product-img" alt="${prod.title || 'Ürün'}">
            <div class="product-body">
              <div>
                <div class="product-meta">${prod.brand || 'Genel'} • ${market.name || 'Market'}</div>
                <div class="product-title">${prod.title || 'Ürün'} (${prod.net_quantity || ''} ${prod.unit_type || ''})</div>
              </div>
              <div class="price-container">
                <div>
                  <span class="unit-price-lbl">Birim Fiyat</span>
                  <div class="unit-price-val">${item.unitPrice.toFixed(2)} ₺ <span style="font-size:0.7rem; font-weight:normal;">/ ${prod.unit_type || 'birim'}</span></div>
                </div>
                <div>
                  <span class="net-price-lbl">Paket Fiyatı</span>
                  <div class="net-price-val">${Number(item.net_price).toFixed(2)} ₺</div>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    loadData();
  </script>
</body>
</html>
