<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Birimçek - Test</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f0f0f0; }
    .header-controls { display: flex; gap: 10px; align-items: center; background: white; padding: 15px; border-radius: 8px; }
    .view-btn { padding: 10px 20px; border: 1px solid #ccc; cursor: pointer; font-weight: bold; }
    .view-btn.active { background: #ff6000; color: white; border-color: #ff6000; }
  </style>
</head>
<body>
  <h2>Birimçek Güncelleme Testi</h2>
  <div class="header-controls">
    <span>Görünüm Seçimi:</span>
    <button class="view-btn active" id="btnGrid" onclick="switchView('grid')">Izgara ▦</button>
    <button class="view-btn" id="btnTable" onclick="switchView('table')">Tablo ☰</button>
  </div>
  <div id="content" style="margin-top:20px; font-size: 1.2rem;">
    Şu an IZGARA görünümündesiniz.
  </div>

  <script>
    function switchView(mode) {
      document.getElementById('btnGrid').classList.toggle('active', mode === 'grid');
      document.getElementById('btnTable').classList.toggle('active', mode === 'table');
      document.getElementById('content').innerText = mode === 'grid' 
        ? "Şu an IZGARA görünümündesiniz." 
        : "Şu an TABLO görünümündesiniz.";
    }
  </script>
</body>
</html>
