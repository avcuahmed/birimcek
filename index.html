<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birimçek - Akıllı Birim Fiyat Karşılaştırma</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; color: #333; padding-bottom: 50px; }
    header { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 25px 20px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    header h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 5px; }
    header p { font-size: 0.95rem; opacity: 0.9; }
    
    .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
    
    /* Filtreleme ve Sıralama Barı */
    .filter-bar { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    .filter-title { font-weight: 600; color: #444; }
    .sort-buttons { display: flex; gap: 10px; }
    .btn-sort { background: #eef4ff; color: #1e3c72; border: 1px solid #cbdcfd; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.2s; }
    .btn-sort:hover, .btn-sort.active { background: #1e3c72; color: white; }

    /* Pop-Up Stili (Madde 8 - Varsayılan olarak gizli) */
    .popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 9999; }
    .popup-card { background: white; padding: 25px; border-radius: 12px; max-width: 450px; width: 90%; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); position: relative; animation: fadeIn 0.3s ease; }
    .popup-card h3 { color: #1e3c72; margin-bottom: 12px; font-size: 1.3rem; }
    .popup-card p { font-size: 0.95rem; color: #555; line-height: 1.5; margin-bottom: 20px; }
    .popup-timer { font-size: 0.8rem; color: #888; margin-top: 10px; }
    .btn-close { background: #1e3c72; color: white; border: none; padding: 10px 24px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-close:hover { background: #2a5298; }

    /* Ürün Listesi Grid */
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
    .product-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #eef0f4; transition: transform 0.2s; }
    .product-card:hover { transform: translateY(-3px); }
    .product-img { width: 100%; height: 180px; object-fit: cover; background: #eee; }
    .product-info { padding: 15px; }
    .product-brand { font-size: 0.8rem; color: #888; text-transform: uppercase; font-weight: bold; }
    .product-title { font-size: 1.1rem; font-weight: 600; margin: 4px 0 10px; color: #222; }
    
    .price-box { background: #eef4ff; padding: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
    .unit-price { color: #d9534f; font-weight: bold; font-size: 1.1rem; }
    .unit-price span { font-size: 0.75rem; color: #666; display: block; font-weight: normal; }
    .net-price { text-align: right; font-size: 0.9rem; color: #555; }

    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>

  <header>
    <h1>Birimçek</h1>
    <p>Rafları Çek, En Ucuz Birim Fiyatı Anında Bul</p>
  </header>

  <!-- Sıralama Esnasında Tetiklenen Pop-Up -->
  <div id="unitPricePopup" class="popup-overlay">
    <div class="popup-card">
      <h3>⚠️ Birim Fiyat Sıralaması</h3>
      <p>Ürünler toplam paket fiyatına göre değil, <strong>1 kg / 1 Litre birim maliyetine</strong> göre en ucuzdan en pahalıya sıralanmıştır.</p>
      <button class="btn-close" onclick="closePopup()">Anladım</button>
      <div class="popup-timer"><span id="timerSec">15</span> saniye içinde kendiliğinden kapanacak.</div>
    </div>
  </div>

  <div class="container">
    
    <!-- Filtreleme ve Sıralama Barı (Madde 7 & 8) -->
    <div class="filter-bar">
      <span class="filter-title">Güncel Ürünler</span>
      <div class="sort-buttons">
        <button class="btn-sort" onclick="fetchProducts('created_at')">Yeni Eklenenler</button>
        <button class="btn-sort active" id="btnSortUnit" onclick="sortByUnitPrice()">Birim Fiyata Göre Sırala 📊</button>
      </div>
    </div>

    <div id="productList" class="product-grid">
      <p style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px;">Ürünler yükleniyor...</p>
    </div>
  </div>

  <script>
    // Supabase Bağlantısı
    const SUPABASE_URL = "https://uuvldmikiiqtutisrhjg.supabase.co/rest/v1/";
    const SUPABASE_KEY = "sb_secret_4e7Vauxpvf_vGJK_1Ag0gA_W4IsGVag";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let popupInterval;

    // Kullanıcı Birim Fiyata Göre Sırala Butonuna Bastığında Tetiklenen Fonksiyon
    function sortByUnitPrice() {
      showPopup();
      fetchProducts('unit_price');
    }

    function showPopup() {
      const popupElem = document.getElementById("unitPricePopup");
      const timerElem = document.getElementById("timerSec");
      
      let timeLeft = 15;
      timerElem.innerText = timeLeft;
      popupElem.style.display = "flex";

      clearInterval(popupInterval);
      popupInterval = setInterval(() => {
        timeLeft--;
        timerElem.innerText = timeLeft;
        if (timeLeft <= 0) {
          closePopup();
        }
      }, 1000);
    }

    function closePopup() {
      clearInterval(popupInterval);
      document.getElementById("unitPricePopup").style.display = "none";
    }

    // Ürün Verilerini Çekme
    async function fetchProducts(orderByColumn = 'unit_price') {
      const container = document.getElementById("productList");
      container.innerHTML = <p style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px;">Yükleniyor...</p>;

      const { data, error } = await supabaseClient
        .from('prices')
        .select(`
          net_price,
          unit_price,
          products ( title, brand, net_quantity, unit_type, image_url ),
          markets ( name )
        `)
        .order(orderByColumn, { ascending: true });

      if (error || !data || data.length === 0) {
        container.innerHTML = <p style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px;">Henüz listelenecek ürün verisi bulunmuyor.</p>;
        return;
      }

      container.innerHTML = "";
      data.forEach(item => {
        const prod = item.products;
        const market = item.markets;
        const defaultImg = "https://images.unsplash.com/photo-1542838132-92c53300491e?w=500&q=80";

        container.innerHTML += `
          <div class="product-card">
            <img src="${prod.image_url || defaultImg}" class="product-img" alt="${prod.title}">
            <div class="product-info">
              <div class="product-brand">${prod.brand || 'Genel'} • ${market ? market.name : ''}</div>
              <div class="product-title">${prod.title} (${prod.net_quantity} ${prod.unit_type})</div>
              <div class="price-box">
                <div class="unit-price">
                  <span>Birim Fiyat</span>
                  ${item.unit_price ? item.unit_price.toFixed(2) : '-'} ₺ / ${prod.unit_type}
                </div>
                <div class="net-price">
                  <span style="font-size:0.75rem; color:#888; display:block;">Paket Fiyatı</span>
                  <strong>${item.net_price.toFixed(2)} ₺</strong>
                </div>
              </div>
            </div>
          </div>
        `;
      });
    }

    // Sayfa ilk açıldığında varsayılan yükleme
    fetchProducts('unit_price');
  </script>
</body>
</html>
