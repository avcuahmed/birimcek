<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birimçek - Akıllı Alışveriş & Birim Fiyat Karşılaştırma</title>
  <style>
    :root {
      --primary: #2a9d8f;
      --primary-dark: #218376;
      --secondary: #2b2d42;
      --accent: #e76f51;
      --bg-light: #f8f9fa;
      --border-color: #e2e8f0;
      --text-main: #2b2d42;
      --text-muted: #6c757d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #ffffff; color: var(--text-main); }

    .top-announcement { background: #f1f5f9; font-size: 0.8rem; text-align: center; padding: 6px 10px; color: #475569; border-bottom: 1px solid var(--border-color); }

    header { max-width: 1200px; margin: 0 auto; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
    .logo-area { display: flex; align-items: center; gap: 10px; text-decoration: none; font-size: 1.6rem; font-weight: 800; color: var(--secondary); }
    .logo-area span { color: var(--primary); }
    
    .header-icons { display: flex; align-items: center; gap: 18px; color: var(--secondary); }
    .icon-btn { position: relative; cursor: pointer; text-decoration: none; color: inherit; font-size: 1.3rem; display: flex; align-items: center; }
    .icon-badge { position: absolute; top: -6px; right: -8px; background: var(--primary); color: white; font-size: 0.65rem; font-weight: bold; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

    .search-wrapper { max-width: 1200px; margin: 0 auto 15px; padding: 0 20px; }
    .search-bar { display: flex; border: 2px solid var(--primary); border-radius: 6px; overflow: hidden; }
    .search-category { background: #f8fafc; border: none; padding: 0 15px; border-right: 1px solid var(--border-color); outline: none; font-size: 0.85rem; color: #475569; cursor: pointer; }
    .search-input { flex: 1; border: none; padding: 10px 15px; outline: none; font-size: 0.9rem; }
    .search-btn { background: var(--primary); border: none; color: white; padding: 0 20px; cursor: pointer; font-size: 1.1rem; }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

    .hero-slider { position: relative; width: 100%; height: 260px; border-radius: 8px; overflow: hidden; margin-bottom: 30px; background: #f1f5f9; }
    .slide { display: none; width: 100%; height: 100%; object-fit: cover; }
    .slide.active { display: block; }

    .section-title { font-size: 1.25rem; font-weight: 700; color: var(--secondary); margin-bottom: 15px; position: relative; padding-bottom: 5px; }
    .section-title::after { content: ''; position: absolute; bottom: 0; left: 0; width: 50px; height: 3px; background: var(--primary); }

    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .product-card { border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; transition: transform 0.2s, box-shadow 0.2s; position: relative; background: #fff; display: flex; flex-direction: column; justify-content: space-between; }
    .product-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
    .best-badge { position: absolute; top: 10px; left: 10px; background: #10b981; color: white; font-size: 0.7rem; font-weight: bold; padding: 3px 7px; border-radius: 4px; }
    .product-img { width: 100%; height: 140px; object-fit: contain; margin-bottom: 12px; }
    .product-vendor { font-size: 0.75rem; color: var(--text-muted); font-weight: bold; text-transform: uppercase; }
    .product-name { font-size: 0.88rem; font-weight: 600; color: var(--secondary); margin: 4px 0 8px; height: 36px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    
    .unit-price-box { background: #f0fdf4; border: 1px solid #bbf7d0; padding: 6px; border-radius: 4px; margin-top: 5px; }
    .unit-price-val { color: var(--primary); font-weight: 800; font-size: 1rem; }
    .net-price-val { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

    .featured-categories { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 40px; }
    .cat-card { min-width: 110px; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px 8px; text-align: center; cursor: pointer; transition: all 0.2s; }
    .cat-card:hover, .cat-card.active { border-color: var(--primary); background: #f0fdf4; }
    .cat-icon { font-size: 1.5rem; margin-bottom: 4px; }
    .cat-name { font-size: 0.75rem; font-weight: 600; color: var(--secondary); }

    @media (max-width: 600px) {
      .search-category { display: none; }
      .hero-slider { height: 160px; }
    }
  </style>
</head>
<body>

  <div class="top-announcement">
    🚀 Tüm market ürünlerinde canlı birim fiyat karşılaştırması!
  </div>

  <header>
    <a href="#" class="logo-area">⚡ Birim<span>çek</span></a>
    <div class="header-icons">
      <div class="icon-btn">👤</div>
      <div class="icon-btn">🔄<span class="icon-badge">0</span></div>
      <div class="icon-btn">❤️<span class="icon-badge">0</span></div>
      <div class="icon-btn">🛒<span class="icon-badge">0</span></div>
    </div>
  </header>

  <div class="search-wrapper">
    <div class="search-bar">
      <select class="search-category" id="categorySelect" onchange="filterProducts()">
        <option value="Tümü">Tüm Kategoriler</option>
        <option value="Süt & Kahvaltılık">Süt & Kahvaltılık</option>
        <option value="Temel Gıda">Temel Gıda</option>
        <option value="Deterjan & Ev Temizliği">Deterjan & Temizlik</option>
        <option value="Atıştırmalıklar">Atıştırmalıklar</option>
      </select>
      <input type="text" class="search-input" id="searchInput" placeholder="Ürün, marka veya market ara..." oninput="filterProducts()">
      <button class="search-btn">🔍</button>
    </div>
  </div>

  <div class="container">
    <div class="hero-slider">
      <img src="https://images.unsplash.com/photo-1542838132-92c53300491e?w=1200&q=80" class="slide active" alt="Slider 1">
      <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=1200&q=80" class="slide" alt="Slider 2">
    </div>

    <h3 class="section-title">Kategoriler</h3>
    <div class="featured-categories">
      <div class="cat-card active" onclick="selectCategory('Tümü', this)"><div class="cat-icon">🛒</div><div class="cat-name">Tümü</div></div>
      <div class="cat-card" onclick="selectCategory('Süt & Kahvaltılık', this)"><div class="cat-icon">🥛</div><div class="cat-name">Süt & Kahvaltı</div></div>
      <div class="cat-card" onclick="selectCategory('Temel Gıda', this)"><div class="cat-icon">🌾</div><div class="cat-name">Temel Gıda</div></div>
      <div class="cat-card" onclick="selectCategory('Deterjan & Ev Temizliği', this)"><div class="cat-icon">🧹</div><div class="cat-name">Temizlik</div></div>
      <div class="cat-card" onclick="selectCategory('Atıştırmalıklar', this)"><div class="cat-icon">🍫</div><div class="cat-name">Atıştırmalık</div></div>
      <div class="cat-card" onclick="selectCategory('İçecekler', this)"><div class="cat-icon">🧃</div><div class="cat-name">İçecekler</div></div>
    </div>

    <h3 class="section-title">En Uygun Birim Fiyatlı Ürünler</h3>
    <div class="product-grid" id="productList">
      <p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">Yükleniyor...</p>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = "https://uuvldmikiiqtutisrhjg.supabase.co";
  
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1dmxkbWlraWlxdHV0aXNyaGpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczOTU0NjIsImV4cCI6MjEwMjk3MTQ2Mn0.RWeP1HAjIw1m0zv4ZAPEaoovyMS2-ckhCmqtl0xLDEU";

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    let allProductsCombined = [];
    let selectedCategory = 'Tümü';

    async function loadData() {
      try {
        const { data: prices, error: pErr } = await supabase.from('prices').select('*');
        const { data: products, error: prErr } = await supabase.from('products').select('*');
        const { data: markets, error: mErr } = await supabase.from('markets').select('*');

        if (pErr || !prices) {
          console.error("Veri hatası:", pErr);
          document.getElementById("productList").innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: red; padding: 40px;">401 Yetkilendirme Hatası: Supabase API Key anahtarınızı güncelleyin.</p>`;
          return;
        }

        allProductsCombined = prices.map(price => {
          const prod = (products || []).find(p => p.id === price.product_id) || {};
          const market = (markets || []).find(m => m.id === price.market_id) || {};
          const qty = prod.net_quantity || 1;
          const unitPrice = price.net_price ? (price.net_price / qty) : 0;

          return { ...price, product: prod, market: market, unitPrice };
        });

        filterProducts();
      } catch (err) {
        console.error("Bağlantı Hatası:", err);
      }
    }

    window.selectCategory = function(cat, el) {
      document.querySelectorAll('.cat-card').forEach(c => c.classList.remove('active'));
      if(el) el.classList.add('active');
      selectedCategory = cat;
      document.getElementById("categorySelect").value = cat;
      filterProducts();
    };

    window.filterProducts = function() {
      const searchTerm = (document.getElementById("searchInput").value || '').toLowerCase();
      const dropCat = document.getElementById("categorySelect").value;
      const catToUse = dropCat !== 'Tümü' ? dropCat : selectedCategory;

      const filtered = allProductsCombined.filter(item => {
        const prod = item.product || {};
        let matchesCat = catToUse === 'Tümü';
        if (!matchesCat && prod.category) {
          matchesCat = prod.category.toLowerCase().includes(catToUse.toLowerCase());
        }
        const matchesSearch = (prod.title || '').toLowerCase().includes(searchTerm) || (prod.brand || '').toLowerCase().includes(searchTerm);
        return matchesCat && matchesSearch;
      });

      filtered.sort((a, b) => a.unitPrice - b.unitPrice);
      renderGrid(filtered);
    };

    function renderGrid(items) {
      const container = document.getElementById("productList");
      const defaultImg = "https://images.unsplash.com/photo-1542838132-92c53300491e?w=500&q=80";

      if (items.length === 0) {
        container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">Aranan kriterlere uygun ürün bulunamadı.</p>`;
        return;
      }

      container.innerHTML = items.map((item, index) => {
        const prod = item.product || {};
        const market = item.market || {};
        const isBest = index === 0;

        return `
          <div class="product-card">
            ${isBest ? `<div class="best-badge">🏆 En Uygun Birim Fiyat</div>` : ''}
            <img src="${prod.image_url || defaultImg}" class="product-img" alt="${prod.title}">
            <div>
              <div class="product-vendor">${prod.brand || 'Genel'} • ${market.name || ''}</div>
              <div class="product-name">${prod.title || 'İsimsiz Ürün'}</div>
            </div>
            <div class="unit-price-box">
              <div class="unit-price-val">${(item.unitPrice || 0).toFixed(2)} ₺ <span style="font-size:0.75rem; color:#666;">/ ${prod.unit_type || 'birim'}</span></div>
              <div class="net-price-val">Paket Fiyatı: <strong>${Number(item.net_price || 0).toFixed(2)} ₺</strong></div>
            </div>
          </div>
        `;
      }).join('');
    }

    loadData();
  </script>
</body>
</html>
