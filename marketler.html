<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Marketler | Birimçek</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"> 
</head>
<body>

  <div id="header-container"></div>

  <div class="main-container">
    <div class="section-title-wrap">
      <h3 class="section-title"><i class="fa-solid fa-store" style="color: var(--primary);"></i> Anlaşmalı Marketler Ağı</h3>
      <span style="font-size: 0.82rem; color: var(--text-muted);">Güncel Fiyat Veri Kaynakları</span>
    </div>

    <div class="product-grid">
      <div class="card-product" style="text-align: center; padding: 25px;">
        <i class="fa-solid fa-shop" style="font-size: 2.5rem; color: var(--primary); margin-bottom: 12px;"></i>
        <h4 class="product-title" style="height: auto; margin-bottom: 5px;">Migros</h4>
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px;">Aktif Ürün: 1,420 • Güncel</p>
        <button class="add-to-cart-btn" onclick="alert('Migros ürünlerine yönlendiriliyorsunuz.')">Ürünleri Gör</button>
      </div>
      <div class="card-product" style="text-align: center; padding: 25px;">
        <i class="fa-solid fa-shop" style="font-size: 2.5rem; color: var(--primary); margin-bottom: 12px;"></i>
        <h4 class="product-title" style="height: auto; margin-bottom: 5px;">A101</h4>
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px;">Aktif Ürün: 1,150 • Güncel</p>
        <button class="add-to-cart-btn" onclick="alert('A101 ürünlerine yönlendiriliyorsunuz.')">Ürünleri Gör</button>
      </div>
      <div class="card-product" style="text-align: center; padding: 25px;">
        <i class="fa-solid fa-shop" style="font-size: 2.5rem; color: var(--primary); margin-bottom: 12px;"></i>
        <h4 class="product-title" style="height: auto; margin-bottom: 5px;">BİM</h4>
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px;">Aktif Ürün: 980 • Güncel</p>
        <button class="add-to-cart-btn" onclick="alert('BİM ürünlerine yönlendiriliyorsunuz.')">Ürünleri Gör</button>
      </div>
    </div>
  </div>

  <div id="drawers-container"></div>
  <div id="footer-container"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
