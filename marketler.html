<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketler - Birimçek</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --primary: #0b4d3c; --primary-light: #52e396; --text-dark: #1e293b; --text-muted: #64748b; --border-color: #e2e8f0; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f8faf9; color: var(--text-dark); }
    header { background: var(--primary); padding: 15px 40px; display: flex; align-items: center; justify-content: space-between; }
    .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; font-size: 1.8rem; font-weight: 800; color: #ffffff; }
    .logo i { color: var(--primary-light); }
    nav { background: #ffffff; border-bottom: 1px solid var(--border-color); padding: 0 40px; display: flex; align-items: center; height: 50px; }
    .nav-links { display: flex; gap: 25px; list-style: none; }
    .nav-links a { text-decoration: none; color: var(--text-dark); font-size: 0.88rem; font-weight: 600; }
    .nav-links a.active { color: var(--primary); font-weight: 700; }
    .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
    .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
    .market-card { background: #ffffff; border: 1px solid var(--border-color); border-radius: 12px; padding: 25px; text-align: center; }
    .market-icon { font-size: 2.5rem; color: var(--primary); margin-bottom: 15px; }
    .market-name { font-size: 1.2rem; font-weight: 800; color: var(--primary); margin-bottom: 8px; }
    .market-btn { display: inline-block; margin-top: 15px; padding: 8px 16px; background: var(--primary-light); color: var(--primary); font-weight: 700; text-decoration: none; border-radius: 6px; font-size: 0.85rem; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo"><i class="fa-solid fa-leaf"></i>Birimçek</a>
  </header>

  <nav>
    <ul class="nav-links">
      <li><a href="index.html">Ana Sayfa</a></li>
      <li><a href="firsatlar.html">Fırsatlar</a></li>
      <li><a href="marketler.html" class="active">Marketler</a></li>
      <li><a href="urunler.html">Tüm Ürünler</a></li>
    </ul>
  </nav>

  <div class="container">
    <h1 style="color:var(--primary); font-size:1.8rem; margin-bottom:10px;">Anlaşmalı Marketler</h1>
    <p style="color:var(--text-muted); margin-bottom:30px;">Fiyat verilerini günlük olarak kıyasladığımız zincir marketler.</p>

    <div class="market-grid" id="marketList">
      <p style="grid-column: 1/-1; text-align: center;">Marketler yükleniyor...</p>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    const supabase = createClient("https://lejkdyhensjyauburrxk.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxlamtkeWhlbnNqeWF1YnVycnhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MjE1MDQsImV4cCI6MjE0Mjk5NzUwNH0.7aVdxtM-1BFVmwVcc0eqLZospU2XkfDhLHr77HMI_2Y");

    async function loadMarkets() {
      const { data: markets } = await supabase.from('markets').select('*');

      if (!markets || markets.length === 0) {
        document.getElementById("marketList").innerHTML = "<p>Market bulunamadı.</p>";
        return;
      }

      document.getElementById("marketList").innerHTML = markets.map(m => `
        <div class="market-card">
          <i class="fa-solid fa-store market-icon"></i>
          <div class="market-name">${m.name}</div>
          <p style="font-size:0.85rem; color:#64748b;">Güncellenen ürün fiyatları sistemdedir.</p>
          <a href="urunler.html" class="market-btn">Ürünleri Gör</a>
        </div>
      `).join('');
    }

    loadMarkets();
  </script>
</body>
</html>
