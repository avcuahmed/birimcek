<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sepetim - Birimçek</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --primary: #0b4d3c; --primary-light: #52e396; --text-dark: #1e293b; --text-muted: #64748b; --border-color: #e2e8f0; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f8faf9; color: var(--text-dark); }
    header { background: var(--primary); padding: 15px 40px; display: flex; align-items: center; justify-content: space-between; }
    .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; font-size: 1.8rem; font-weight: 800; color: #ffffff; }
    .logo i { color: var(--primary-light); }
    .container { max-width: 800px; margin: 60px auto; padding: 0 20px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo"><i class="fa-solid fa-leaf"></i>Birimçek</a>
  </header>
  
  <div class="container">
    <i class="fa-solid fa-basket-shopping" style="font-size: 4rem; color: var(--primary); margin-bottom: 20px;"></i>
    <h1 style="color:var(--primary); margin-bottom: 10px;">Sepetiniz Henüz Boş</h1>
    <p style="color:var(--text-muted); margin-bottom: 25px;">Market fiyatlarını kıyaslamak ve sepet oluşturmak için ürünleri ekleyebilirsiniz.</p>
    <a href="urunler.html" style="background:var(--primary-light); color:var(--primary); padding: 12px 24px; text-decoration:none; font-weight:700; border-radius:6px;">Ürünleri İncele</a>
  </div>
</body>
</html>
