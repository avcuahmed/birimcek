<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Tüm Ürünler | Birimçek</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"> 
</head>
<body>

  <div id="header-container"></div>

  <div class="main-container">
    <div class="section-title-wrap">
      <h3 class="section-title">Tüm Ürünler ve Market Karşılaştırmaları</h3>
      <select class="sort-select-box" id="productSortSelect" onchange="window.handleProductSort(this.value)">
        <option value="default">Sıralama Seçiniz</option>
        <option value="unit_asc">Birim Fiyata Göre (En Düşük)</option>
        <option value="unit_desc">Birim Fiyata Göre (En Yüksek)</option>
        <option value="price_asc">Etiket Fiyatına Göre</option>
      </select>
    </div>

    <div class="product-grid" id="productList">
      <div class="card-product">
        <div>
          <div class="card-product-wrapper">
            <span class="card-product-badge">%20 İndirim</span>
            <img src="https://images.unsplash.com/photo-1542838132-92c53300491e?w=200&q=80" class="card-product-img" alt="Ürün">
          </div>
          <div class="card-product-info">
            <span class="product-vendor">Migros</span>
            <h4 class="product-title">Örnek Süt 1 Litre UHT</h4>
            <div class="unit-price-box">
              <span class="unit-price-val">24.50 ₺</span><small>/L</small>
            </div>
          </div>
        </div>
        <button class="add-to-cart-btn" onclick="window.addToCart('Örnek Süt 1 Litre UHT', 24.50, 'https://images.unsplash.com/photo-1542838132-92c53300491e?w=200&q=80')">
          <i class="fa-solid fa-plus"></i> Sepete Ekle
        </button>
      </div>
    </div>
  </div>

  <div id="drawers-container"></div>
  <div id="footer-container"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
